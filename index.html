<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/fav.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/styles/reset.css">
    <link rel="stylesheet" href="assets/styles/root.css">
    <link rel="stylesheet" href="assets/styles/main.css">
    <link rel="stylesheet" href="assets/styles/desktop.css" media="screen and (min-width:48rem)">
    <script src="https://kit.fontawesome.com/870d21c1e1.js" crossorigin="anonymous"></script>
    <title>Conteúdo pessoal</title>
</head>
<body>
   <header>
      <div class="box_btn">
         <button type="button" class="but">Home</button>
         <button type="button" class="but">Fotos</button>
         <div id="box_tema">
         <i class="fa-solid fa-sun" id="tema"></i>
         </div>
      </div>
      <div class="image">
         <img src="assets/images/icon.png" alt="icone do site">
      </div>
   </header>
   <main>
     <!-- Aqui fica o conteúdo -->
     <section class="content content_active">
       <h1>Sejam todos bem-vindos ao meu site! sou Wellington Lacerda</h1>
       <span>Sou um desenvolvedor Web</span>
       <div class="info">
          <img src="assets/images/face-bored.jpg" alt="perfil do meu site" id="perfil" class="faces" >  
       </div>
       <div class="radio_faces">
           <input type="radio" name="face" id="bored" checked class="radio">
           <input type="radio" name="face" id="chated" class="radio">
           <input type="radio" name="face" id="sad" class="radio">
           <input type="radio" name="face" id="happy" class="radio">

        <label for="bored" class="radio_disabled">😑</label>
        <label for="chated" class="radio_disabled">😒</label>
        <label for="sad" class="radio_disabled">😢</label>
        <label for="happy" class="radio_disabled">😊</label>
       </div>
       <div class="box_txt">
          
       </div>
       <nav>
           <ul>
               <li><a href="https://www.youtube.com/@wellington_Lacerda" target="_blank" rel="nofollow"><i class="fa-brands fa-youtube"></i></a></li>
               <li><a href="https://github.com/WellingtonDeLacerda" target="_blank" rel="nofollow"><i class="fa-brands fa-github"></i></a></li>
               <li><a href="https://www.instagram.com/wellington_lacerda.art?igsh=djd5aHYxaDNwbjRn" target="_blank" rel="nofollow"><i class="fa-brands fa-instagram" ></i></a></li>
               <li><a href="https://www.facebook.com/share/16iW8cM14r/" target="_blank" rel="nofollow"><i class="fa-brands fa-facebook"></i></a></li>
           </ul>
       </nav>
     </section>
     <!-- Aqui fica as fotos -->
     <section class="fotos fotos_disabled" id="fotos">
         
     </section>
   </main>
   <script src="assets/scripts/script.js"></script>
</body>
</html>
